<div id="fatal">

  <p id="fatal-msg">Sepertinya koneksi ke library React gagal dimuat. Coba: (1) pindah ke WiFi, (2) buka pakai Chrome biasa (bukan browser dalam aplikasi lain), atau (3) refresh halaman ini.</p>
  <pre id="fatal-detail" style="white-space:pre-wrap; font-size:11px; color:#DFA23A; background:#1B2126; padding:10px; border-radius:6px; max-height:300px; overflow:auto;"></pre>
</div>
<script>
  // Tangkap error JS apapun dan tampilkan di layar (biar gak blank tanpa keterangan)
  window.addEventListener("error", function(ev){
    var box = document.getElementById("fatal");
    var detail = document.getElementById("fatal-detail");
    var msgEl = document.getElementById("fatal-msg");
    if (box) box.style.display = "block";
    if (msgEl) msgEl.textContent = "Ada error JavaScript yang bikin aplikasi gagal jalan:";
    if (detail) detail.textContent += (ev.message||"Unknown error") + "\n  at " + (ev.filename||"?") + ":" + (ev.lineno||"?") + ":" + (ev.colno||"?") + "\n\n";
  });
  window.addEventListener("unhandledrejection", function(ev){
    var box = document.getElementById("fatal");
    var detail = document.getElementById("fatal-detail");
    if (box) box.style.display = "block";
    if (detail) detail.textContent += "Promise error: " + (ev.reason && ev.reason.message ? ev.reason.message : ev.reason) + "\n\n";
  });
  // Jika React gagal dimuat dari CDN (misal diblokir jaringan), tampilkan pesan yang jelas
  window.addEventListener("load", function(){
    setTimeout(function(){
      if (typeof React === "undefined" || typeof ReactDOM === "undefined") {
        document.getElementById("fatal").style.display = "block";
      }
    }, 4000);
  });

/* ---------------- IMAGE / CANVAS HELPERS ---------------- */
function loadImage(src){
  return new Promise(function(res,rej){
    var img = new Image();
    img.onload = function(){ res(img); };
    img.onerror = rej;
    img.src = src;
    // Pastikan benar-benar selesai di-decode sebelum dipakai (mencegah hasil canvas gelap/kosong di HP tertentu)
    if (img.decode){
      img.decode().then(function(){ res(img); }).catch(function(){ /* biarkan onload yang menangani */ });
    }
  });
}
function fileToDataURL(file){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=rej; r.readAsDataURL(file); }); }

// Ambil sumber gambar siap-gambar dari File ATAU dataURL, pakai createImageBitmap kalau tersedia
// (lebih cepat, lebih hemat memori, dan otomatis membenarkan orientasi EXIF)
async function loadDrawSource(source){
  if (source instanceof Blob){
    if (window.createImageBitmap){
      try { return await createImageBitmap(source, {imageOrientation:"from-image"}); }
      catch(e){ /* lanjut ke jalur fallback di bawah */ }
    }
    var dataUrl = await fileToDataURL(source);
    return await loadImage(dataUrl);
  }
  return await loadImage(source);
}

async function capImage(source, maxSide){
  maxSide = maxSide || 2600;
  var img = await loadDrawSource(source);
  var scale = Math.min(1, maxSide/Math.max(img.width,img.height));
  var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
  var c = document.createElement("canvas"); c.width=w; c.height=h;
  c.getContext("2d").drawImage(img,0,0,w,h);
  if (img.close) img.close(); // lepas memori ImageBitmap
  return { dataUrl: c.toDataURL("image/jpeg",0.95), width:w, height:h };
}
async function tinyForAI(dataUrl, maxSide){
  maxSide = maxSide || 900;
  var img = await loadImage(dataUrl);
  var scale = Math.min(1, maxSide/Math.max(img.width,img.height));
  var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
  var c = document.createElement("canvas"); c.width=w; c.height=h;
  c.getContext("2d").drawImage(img,0,0,w,h);
  return c.toDataURL("image/jpeg",0.8).split(",")[1];
}
async function extractVideoFrame(file){
  var url = URL.createObjectURL(file);
  var video = document.createElement("video");
  video.src = url; video.muted = true;
  await new Promise(function(res){ video.onloadedmetadata = res; });
  video.currentTime = Math.min(video.duration/2, video.duration-0.05);
  await new Promise(function(res){ video.onseeked = res; });
  var c = document.createElement("canvas");
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext("2d").drawImage(video,0,0);
  URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg",0.92);
}

async function renderEdited(workingDataUrl, edits){
  var img = await loadImage(workingDataUrl);
  var angle = ((edits.rotate90 + edits.fine) * Math.PI) / 180;
  var rad = Math.abs(angle);
  var bw = Math.abs(img.width*Math.cos(rad)) + Math.abs(img.height*Math.sin(rad));
  var bh = Math.abs(img.width*Math.sin(rad)) + Math.abs(img.height*Math.cos(rad));
  var rc = document.createElement("canvas"); rc.width=bw; rc.height=bh;
  var rctx = rc.getContext("2d");
  rctx.translate(bw/2,bh/2); rctx.rotate(angle);
  if (edits.flipH) rctx.scale(-1,1);
  rctx.filter = "brightness("+edits.brightness+"%) contrast("+edits.contrast+"%) saturate("+edits.saturation+"%)";
  rctx.drawImage(img, -img.width/2, -img.height/2);

  var arParts = edits.aspect==="original" ? [bw,bh] : edits.aspect.split(":").map(Number);
  var arW = arParts[0], arH = arParts[1];
  var cropW,cropH;
  if (arW/arH > bw/bh){ cropW=bw; cropH=bw*(arH/arW); } else { cropH=bh; cropW=bh*(arW/arH); }
  cropW/=edits.zoom; cropH/=edits.zoom;
  var maxOffX=(bw-cropW)/2, maxOffY=(bh-cropH)/2;
  var cx = bw/2 + (edits.offsetX/100)*maxOffX;
  var cy = bh/2 + (edits.offsetY/100)*maxOffY;
  var sx = Math.max(0, cx-cropW/2), sy = Math.max(0, cy-cropH/2);

  var fc = document.createElement("canvas");
  fc.width = Math.round(cropW); fc.height = Math.round(cropH);
  var fctx = fc.getContext("2d");
  fctx.drawImage(rc, sx, sy, cropW, cropH, 0, 0, cropW, cropH);

  // Healing — samarkan titik yang ditandai dengan warna cincin di sekitarnya
  if (edits.healPoints && edits.healPoints.length > 0){
    var hw=fc.width, hh=fc.height;
    var hdata = fctx.getImageData(0,0,hw,hh);
    var hd = hdata.data;
    edits.healPoints.forEach(function(hp){
      var pcx = hp.x*hw, pcy = hp.y*hh;
      var r = Math.max(4, hp.r*Math.max(hw,hh));
      var feather = r*1.35;
      // Kumpulkan warna rata-rata dari cincin di luar area (sampel 16 sudut)
      var sr=0, sg=0, sb=0, cnt=0;
      for (var ang=0; ang<16; ang++){
        var theta = (ang/16)*Math.PI*2;
        var sx2 = Math.round(pcx + Math.cos(theta)*feather);
        var sy2 = Math.round(pcy + Math.sin(theta)*feather);
        if (sx2<0||sy2<0||sx2>=hw||sy2>=hh) continue;
        var si = (sy2*hw+sx2)*4;
        sr += hd[si]; sg += hd[si+1]; sb += hd[si+2]; cnt++;
      }
      if (cnt===0) return;
      sr/=cnt; sg/=cnt; sb/=cnt;
      var minX = Math.max(0, Math.floor(pcx-feather)), maxX = Math.min(hw-1, Math.ceil(pcx+feather));
      var minY = Math.max(0, Math.floor(pcy-feather)), maxY = Math.min(hh-1, Math.ceil(pcy+feather));
      for (var py=minY; py<=maxY; py++){
        for (var px=minX; px<=maxX; px++){
          var dx2=px-pcx, dy2=py-pcy;
          var dist = Math.sqrt(dx2*dx2+dy2*dy2);
          if (dist > feather) continue;
          var weight = dist<=r ? 1 : Math.max(0, 1 - (dist-r)/(feather-r));
          var pi = (py*hw+px)*4;
          hd[pi]   = hd[pi]   + (sr-hd[pi])*weight;
          hd[pi+1] = hd[pi+1] + (sg-hd[pi+1])*weight;
          hd[pi+2] = hd[pi+2] + (sb-hd[pi+2])*weight;
        }
      }
    });
    fctx.putImageData(hdata,0,0);
  }

  // Noise reduction + Shadows/Highlights/Ambience — digabung satu proses biar hemat waktu
  var needsNeighbor = edits.denoise>0 || edits.colorDenoise>0 || edits.structure>0;
  var needsTone = edits.shadows!==0 || edits.highlights!==0 || edits.ambience!==0;
  if (needsNeighbor || needsTone){
    var tw=fc.width, th=fc.height;
    var tsrc = fctx.getImageData(0,0,tw,th);
    var tsd = tsrc.data;
    var denoiseAmt = edits.denoise/100, colorDenoiseAmt = edits.colorDenoise/100, structureAmt = edits.structure/100*1.6;
    var shadowAmt = edits.shadows/50, highlightAmt = edits.highlights/50, ambienceAmt = edits.ambience/50;
    for (var ty=0; ty<th; ty++){
      for (var tx=0; tx<tw; tx++){
        var ti=(ty*tw+tx)*4;
        var r=tsd[ti], g=tsd[ti+1], b=tsd[ti+2];

        if (needsNeighbor && tx>0 && ty>0 && tx<tw-1 && ty<th-1){
          var nr=(tsd[ti-4]+tsd[ti+4]+tsd[ti-tw*4]+tsd[ti+tw*4])/4;
          var ng=(tsd[ti-4+1]+tsd[ti+4+1]+tsd[ti-tw*4+1]+tsd[ti+tw*4+1])/4;
          var nb=(tsd[ti-4+2]+tsd[ti+4+2]+tsd[ti-tw*4+2]+tsd[ti+tw*4+2])/4;
          if (colorDenoiseAmt > 0){
            var origY = 0.299*r+0.587*g+0.114*b;
            var nY = 0.299*nr+0.587*ng+0.114*nb;
            var scale = nY>1 ? origY/nY : 1;
            var cr=nr*scale, cg=ng*scale, cb=nb*scale;
            r = r + (cr-r)*colorDenoiseAmt; g = g + (cg-g)*colorDenoiseAmt; b = b + (cb-b)*colorDenoiseAmt;
          }
          if (denoiseAmt > 0){
            r = r + (nr-r)*denoiseAmt; g = g + (ng-g)*denoiseAmt; b = b + (nb-b)*denoiseAmt;
          }
          if (structureAmt > 0){
            // Structure/Clarity: perkuat kontras lokal terhadap area sekitarnya (beda dari Sharpen yang lebih halus)
            r = r + structureAmt*(r-nr); g = g + structureAmt*(g-ng); b = b + structureAmt*(b-nb);
          }
        }

        if (needsTone){
          var L = 0.299*r+0.587*g+0.114*b;
          var shadowW = Math.max(0, 1 - L/170);
          var highlightW = Math.max(0, (L-70)/185);
          var midW = Math.max(0, 1 - Math.abs(L-128)/128);
          var delta = shadowAmt*55*shadowW + highlightAmt*55*highlightW;
          var ambFactor = 1 + ambienceAmt*0.35*midW;
          var gray = (r+g+b)/3;
          r = gray + (r-gray)*ambFactor + delta;
          g = gray + (g-gray)*ambFactor + delta;
          b = gray + (b-gray)*ambFactor + delta;
        }

        tsd[ti]=Math.max(0,Math.min(255,r)); tsd[ti+1]=Math.max(0,Math.min(255,g)); tsd[ti+2]=Math.max(0,Math.min(255,b));
      }
    }
    fctx.putImageData(tsrc,0,0);
  }

  // Selective — penyesuaian lokal per titik (brightness/contrast/saturation/structure)
  if (edits.selectivePoints && edits.selectivePoints.length > 0){
    var sw=fc.width, sh=fc.height;
    var sImgData = fctx.getImageData(0,0,sw,sh);
    var ssd = sImgData.data;
    edits.selectivePoints.forEach(function(sp){
      var pcx = sp.x*sw, pcy = sp.y*sh;
      var r = Math.max(10, sp.r*Math.max(sw,sh));
      var feather = r*1.4;
      var bAmt = (sp.brightness||0)/50, cAmt = (sp.contrast||0)/50, satAmt = (sp.saturation||0)/50, stAmt = (sp.structure||0)/100*1.6;
      var minX = Math.max(1, Math.floor(pcx-feather)), maxX = Math.min(sw-2, Math.ceil(pcx+feather));
      var minY = Math.max(1, Math.floor(pcy-feather)), maxY = Math.min(sh-2, Math.ceil(pcy+feather));
      for (var py=minY; py<=maxY; py++){
        for (var px=minX; px<=maxX; px++){
          var dx3=px-pcx, dy3=py-pcy;
          var dist = Math.sqrt(dx3*dx3+dy3*dy3);
          if (dist > feather) continue;
          var weight = dist<=r ? 1 : Math.max(0, 1 - (dist-r)/(feather-r));
          if (weight<=0) continue;
          var pi = (py*sw+px)*4;
          var rr=ssd[pi], gg=ssd[pi+1], bb=ssd[pi+2];
          if (stAmt !== 0){
            var nr2=(ssd[pi-4]+ssd[pi+4]+ssd[pi-sw*4]+ssd[pi+sw*4])/4;
            var ng2=(ssd[pi-4+1]+ssd[pi+4+1]+ssd[pi-sw*4+1]+ssd[pi+sw*4+1])/4;
            var nb2=(ssd[pi-4+2]+ssd[pi+4+2]+ssd[pi-sw*4+2]+ssd[pi+sw*4+2])/4;
            rr = rr + stAmt*weight*(rr-nr2); gg = gg + stAmt*weight*(gg-ng2); bb = bb + stAmt*weight*(bb-nb2);
          }
          if (cAmt !== 0){ rr = 128 + (rr-128)*(1+cAmt*0.5*weight); gg = 128 + (gg-128)*(1+cAmt*0.5*weight); bb = 128 + (bb-128)*(1+cAmt*0.5*weight); }
          if (satAmt !== 0){ var gray2=(rr+gg+bb)/3; rr = gray2 + (rr-gray2)*(1+satAmt*weight); gg = gray2 + (gg-gray2)*(1+satAmt*weight); bb = gray2 + (bb-gray2)*(1+satAmt*weight); }
          if (bAmt !== 0){ var d3 = bAmt*45*weight; rr+=d3; gg+=d3; bb+=d3; }
          ssd[pi]=Math.max(0,Math.min(255,rr)); ssd[pi+1]=Math.max(0,Math.min(255,gg)); ssd[pi+2]=Math.max(0,Math.min(255,bb));
        }
      }
    });
    fctx.putImageData(sImgData,0,0);
  }

  if (edits.sharpen > 0){
    var s = (edits.sharpen/100) * 2.2; // kekuatan sharpen, disetel supaya efeknya terasa proporsional
    var w=fc.width, h=fc.height;
    var src = fctx.getImageData(0,0,w,h);
    var out = fctx.createImageData(w,h);
    var sd=src.data, od=out.data;
    for (var y=0;y<h;y++){
      for (var x=0;x<w;x++){
        var i=(y*w+x)*4;
        if (x===0||y===0||x===w-1||y===h-1){
          od[i]=sd[i]; od[i+1]=sd[i+1]; od[i+2]=sd[i+2]; od[i+3]=sd[i+3]; continue;
        }
        var iTop=((y-1)*w+x)*4, iBot=((y+1)*w+x)*4, iLeft=(y*w+(x-1))*4, iRight=(y*w+(x+1))*4;
        for (var c2=0;c2<3;c2++){
          var neighborAvg = (sd[iTop+c2]+sd[iBot+c2]+sd[iLeft+c2]+sd[iRight+c2]) / 4;
          var center = sd[i+c2];
          // Unsharp mask: perkuat selisih piksel dengan rata-rata sekitarnya (brightness rata-rata tetap terjaga)
          od[i+c2] = Math.max(0,Math.min(255, center + s*(center - neighborAvg)));
        }
        od[i+3]=sd[i+3];
      }
    }
    fctx.putImageData(out,0,0);
  }

  // Temperature (hangat/dingin) — overlay warna dengan blend mode
  if (edits.temperature !== 0){
    var tIntensity = Math.min(0.35, Math.abs(edits.temperature)/100 * 0.35);
    fctx.globalCompositeOperation = "overlay";
    fctx.fillStyle = edits.temperature > 0 ? "rgba(255,150,40,"+tIntensity+")" : "rgba(40,140,255,"+tIntensity+")";
    fctx.fillRect(0,0,fc.width,fc.height);
    fctx.globalCompositeOperation = "source-over";
  }

  // Vignette — gelapkan tepi foto
  if (edits.vignette > 0){
    var vw=fc.width, vh=fc.height;
    var grad = fctx.createRadialGradient(vw/2,vh/2, Math.min(vw,vh)*0.35, vw/2,vh/2, Math.max(vw,vh)*0.72);
    grad.addColorStop(0, "rgba(0,0,0,0)");
    grad.addColorStop(1, "rgba(0,0,0,"+(edits.vignette/100*0.75)+")");
    fctx.fillStyle = grad;
    fctx.fillRect(0,0,vw,vh);
  }

  return fc.toDataURL("image/jpeg",0.95);
}

async function analyzeQuality(dataUrl, realWidth, realHeight){
  var img = await loadImage(dataUrl);
  var w=360, h=Math.round((360*img.height)/img.width);
  var c=document.createElement("canvas"); c.width=w; c.height=h;
  var ctx=c.getContext("2d"); ctx.drawImage(img,0,0,w,h);
  var data = ctx.getImageData(0,0,w,h).data;
  var gray = new Float32Array(w*h);
  var sumB=0, under=0, over=0;
  for (var i=0,p=0; i<data.length; i+=4,p++){
    var g = 0.299*data[i]+0.587*data[i+1]+0.114*data[i+2];
    gray[p]=g; sumB+=g;
    if (g<20) under++; if (g>235) over++;
  }
  var brightnessAvg = sumB/(w*h);
  var underPct=(under/(w*h))*100, overPct=(over/(w*h))*100;
  var lapSum=0, lapSumSq=0, n=0;
  for (var y=1;y<h-1;y++) for (var x=1;x<w-1;x++){
    var idx=y*w+x;
    var lap = -4*gray[idx]+gray[idx-1]+gray[idx+1]+gray[idx-w]+gray[idx+w];
    lapSum+=lap; lapSumSq+=lap*lap; n++;
  }
  var mean=lapSum/n, variance=lapSumSq/n - mean*mean;
  var warnings=[]; var status="ok";
  if (variance<60){ warnings.push("Berpotensi blur / kurang tajam"); status="reject"; }
  else if (variance<130){ warnings.push("Ketajaman pas-pasan, cek manual"); if(status==="ok") status="warning"; }
  if (underPct>8){ warnings.push("Area gelap gosong (underexposed)"); if(status==="ok") status="warning"; }
  if (overPct>8){ warnings.push("Area terang gosong (overexposed)"); if(status==="ok") status="warning"; }
  var mp=(realWidth*realHeight)/1000000;
  if (mp<1){ warnings.push("Resolusi sangat kecil ("+mp.toFixed(1)+"MP), kemungkinan ditolak"); status="reject"; }
  else if (mp<4){ warnings.push("Resolusi "+mp.toFixed(1)+"MP, di bawah rekomendasi umum 4MP"); if(status==="ok") status="warning"; }
  return { variance:Math.round(variance), brightnessAvg:Math.round(brightnessAvg), underPct:underPct, overPct:overPct, mp:mp, warnings:warnings, status:status };
}

/* ---------------- AI CALL ---------------- */
async function generateMetadata(base64Jpeg, settings){
  var prompt = 'Kamu adalah asisten metadata microstock berpengalaman (Shutterstock & Adobe Stock).\n' +
'Amati gambar ini lalu hasilkan metadata SIAP UPLOAD. Balas HANYA JSON valid, tanpa markdown, tanpa teks lain, format persis:\n' +
'{\n' +

    return function(){ window.removeEventListener("resize", onResize); };
  }, []);
  return st[0];
}

          e("select",{value:meta.category_adobe, onChange:function(ev){setMetaField(selected.id,"category_adobe",ev.target.value);},
            style:{width:"100%",background:C.panel2,border:"1px solid "+C.line,color:C.paper,borderRadius:6,padding:7,marginTop:4,fontSize:12.5}},
            ADOBE_CATEGORIES.map(function(c){ return e("option",{key:c,value:c},c); })
          )
        ),
        e("div",{},
          e("label",{style:{fontSize:11,color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}, "KEYWORDS ("+meta.keywords.length+")"),
          e("div",{style:{marginTop:6}}, meta.keywords.map(function(k){ return e(Chip,{key:k, text:k, onRemove:function(){removeKeyword(selected.id,k);}}); }))
        ),
        e("div",{style:{display:"flex",gap:16,fontSize:12.5,color:C.muted}},
          e("span",{},"Editorial: ", e("b",{style:{color: meta.editorial?C.amber:C.teal}}, meta.editorial?"Ya":"Tidak")),
          e("span",{},"Mature: ", e("b",{style:{color: meta.mature_content?C.amber:C.teal}}, meta.mature_content?"Ya":"Tidak"))
        ),
        e("button",{onClick:function(){copyMeta(selected);}, style:{display:"flex",alignItems:"center",justifyContent:"center",gap:8,background:"transparent",border:"1px solid "+C.line,color:C.paper,borderRadius:7,padding:"9px 0",fontSize:13}}, I.copy, " Salin metadata")
      ) : null
    );

    var zoomModal = (zoomOpen && selected.kind!=="video") ? e("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.92)",zIndex:80,display:"flex",flexDirection:"column"}},
      e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px"}},
        e("span",{style:{color:C.paper,fontSize:13}}, Math.round(zoomScale*100)+"%"),
        e("div",{style:{display:"flex",gap:8}},
          e("button",{onClick:function(){setZoomScale(function(z){return Math.max(1,z-0.5);});}, style:{background:C.panel2,border:"1px solid "+C.line,color:C.paper,borderRadius:6,padding:"6px 12px",fontSize:16}}, "−"),
          e("button",{onClick:function(){setZoomScale(function(z){return Math.min(5,z+0.5);});}, style:{background:C.panel2,border:"1px solid "+C.line,color:C.paper,borderRadius:6,padding:"6px 12px",fontSize:16}}, "+"),
          e("button",{onClick:function(){setZoomOpen(false);}, style:{background:C.clay,border:"none",color:"#fff",borderRadius:6,padding:"6px 14px",fontSize:14}}, "Tutup")
        )
      ),
      e("div",{style:{flex:1,overflow:"auto",display:"flex",alignItems:zoomScale<=1?"center":"flex-start",justifyContent:zoomScale<=1?"center":"flex-start",touchAction:"pan-x pan-y"}},
        e("img",{src:selected.editedDataUrl, alt:"", style:{width: (zoomScale*100)+"%", maxWidth: zoomScale<=1?"100%":"none", display:"block"}})
      ),
      e("div",{style:{textAlign:"center",color:C.muted,fontSize:11.5,padding:"8px 16px"}}, "Geser untuk lihat bagian lain \u2022 tombol +/- untuk perbesar")
    ) : null;

    workbench = e(React.Fragment,{}, editSection, metaSection, zoomModal);
  }

  var footer = e("footer",{style:{borderTop:"1px solid "+C.line,padding: isNarrow?"10px 16px":"12px 24px",display:"flex",flexDirection:"column",gap:8}},
    e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}},
      e("span",{style:{fontSize:12,color:C.muted}}, items.filter(function(i){return i.meta;}).length + " dari " + items.length + " file punya metadata siap export"),
      e("div",{style:{display:"flex",gap:10}},
        e("button",{onClick:function(){exportCSV("shutterstock");}, style:{display:"flex",alignItems:"center",gap:7,background:C.panel2,border:"1px solid "+C.line,color:C.paper,borderRadius:7,padding:"9px 14px",fontSize:12.5}}, I.filedown, " CSV Shutterstock"),
        e("button",{onClick:function(){exportCSV("adobe");}, style:{display:"flex",alignItems:"center",gap:7,background:C.panel2,border:"1px solid "+C.line,color:C.paper,borderRadius:7,padding:"9px 14px",fontSize:12.5}}, I.filedown, " CSV Adobe Stock")
      )
    ),
    e("div",{style:{fontSize:10.5,color:C.muted,lineHeight:1.5}},
      "Format didukung: JPG, PNG, WEBP (foto), MP4/MOV/WEBM (video — hanya untuk metadata, editing tetap di HP). Format RAW (DNG, CR2, NEF, dll) belum bisa dibaca browser — convert ke JPEG dulu."
    )
  );

  return e("div",{style:{minHeight:"100vh",background:C.ink,color:C.paper,fontFamily:"'Inter',-apple-system,sans-serif",display:"flex",flexDirection:"column"}},
    header, settingsModal,
    (isNarrow && photoPanelEl) ? e("div",{ref:fixedTopRef, style:{position:"fixed",top:layoutMetrics.headerH,left:0,right:0,zIndex:15,background:C.ink,borderBottom:"1px solid "+C.line}},
      photoPanelEl
    ) : null,
    e("div",{style: isNarrow ? {display:"flex",flexDirection:"column",flex:1,minHeight:0,overflowY:"auto",paddingTop: photoPanelEl?layoutMetrics.fixedH:0} : {display:"flex",flex:1,minHeight:0}},
      filmstrip, workbench
    ),
    footer,
    toast ? e("div",{style:{position:"fixed",left:"50%",bottom:20,transform:"translateX(-50%)",background:C.panel2,border:"1px solid "+C.line,color:C.paper,padding:"10px 18px",borderRadius:99,fontSize:13,boxShadow:"0 6px 24px rgba(0,0,0,.4)",zIndex:100,maxWidth:"90vw",textAlign:"center"}}, toast) : null
  );
}

try {
  ReactDOM.createRoot(document.getElementById("root")).render(e(App));
} catch(err){
  var box = document.getElementById("fatal");
  var detail = document.getElementById("fatal-detail");
  if (box) box.style.display = "block";
  if (detail) detail.textContent += "Render error: " + (err && err.message) + "\n" + (err && err.stack || "") + "\n\n";
}
</script>
</body>
</html>
