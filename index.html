<script type="text/babel" data-presets="react">
const { useState, useRef, useCallback } = React;

/* ---------------- TOKENS ---------------- */
const C = {
  ink:"#14181C", panel:"#1B2126", panel2:"#20272D", line:"#2C343B",
  paper:"#EDEAE2", muted:"#8B939B", teal:"#3FA79E", amber:"#DFA23A", clay:"#C1503B", blue:"#5B8FBE"
};
const SS_CATEGORIES = ["Abstract","Animals/Wildlife","Arts","Backgrounds/Textures","Beauty/Fashion","Buildings/Landmarks","Business/Finance","Celebrities","Education","Food and drink","Healthcare/Medical","Holidays","Industrial","Interiors","Miscellaneous","Nature","Objects","Parks/Outdoor","People","Religion","Science","Signs/Symbols","Sports/Recreation","Technology","Transportation","Vintage"];
const ADOBE_CATEGORIES = ["Animals","Buildings and Architecture","Business","Drinks","The Environment","States of Mind","Food","Graphic Resources","Hobbies and Leisure","Industry","Landscapes","Lifestyle","People","Plants and Flowers","Culture and Religion","Science","Social Issues","Sports","Technology","Transport","Travel"];
const uid = () => Math.random().toString(36).slice(2,10);

/* ---------------- ICONS (inline, no deps) ---------------- */

  upload:  <Icon>⬆️</Icon>, video: <Icon size={12}>🎬</Icon>, sparkles: <Icon>✨</Icon>,

  x: <Icon size={11}>✕</Icon>, filedown: <Icon>⤓</Icon>, gear: <Icon>⚙️</Icon>
};

/* ---------------- IMAGE / CANVAS HELPERS ---------------- */
function loadImage(src){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=src; }); }
function fileToDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }

async function capImage(dataUrl, maxSide=2600){
  const img = await loadImage(dataUrl);
  const scale = Math.min(1, maxSide/Math.max(img.width,img.height));
  const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
  const c = document.createElement("canvas"); c.width=w; c.height=h;
  c.getContext("2d").drawImage(img,0,0,w,h);
  return { dataUrl: c.toDataURL("image/jpeg",0.95), width:w, height:h };
}
async function tinyForAI(dataUrl, maxSide=900){
  const img = await loadImage(dataUrl);
  const scale = Math.min(1, maxSide/Math.max(img.width,img.height));
  const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
  const c = document.createElement("canvas"); c.width=w; c.height=h;
  c.getContext("2d").drawImage(img,0,0,w,h);
  return c.toDataURL("image/jpeg",0.8).split(",")[1];
}
async function extractVideoFrame(file){
  const url = URL.createObjectURL(file);
  const video = document.createElement("video");
  video.src = url; video.muted = true;
  await new Promise((res)=>{ video.onloadedmetadata = res; });
  video.currentTime = Math.min(video.duration/2, video.duration-0.05);
  await new Promise((res)=>{ video.onseeked = res; });
  const c = document.createElement("canvas");
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext("2d").drawImage(video,0,0);
  URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg",0.92);
}

async function renderEdited(workingDataUrl, edits){
  const img = await loadImage(workingDataUrl);
  const angle = ((edits.rotate90 + edits.fine) * Math.PI) / 180;
  const rad = Math.abs(angle);
  const bw = Math.abs(img.width*Math.cos(rad)) + Math.abs(img.height*Math.sin(rad));
  const bh = Math.abs(img.width*Math.sin(rad)) + Math.abs(img.height*Math.cos(rad));
  const rc = document.createElement("canvas"); rc.width=bw; rc.height=bh;
  const rctx = rc.getContext("2d");
  rctx.translate(bw/2,bh/2); rctx.rotate(angle);
  rctx.filter = `brightness(${edits.brightness}%) contrast(${edits.contrast}%) saturate(${edits.saturation}%)`;
  rctx.drawImage(img, -img.width/2, -img.height/2);

  const [arW,arH] = edits.aspect==="original" ? [bw,bh] : edits.aspect.split(":").map(Number);
  let cropW,cropH;
  if (arW/arH > bw/bh){ cropW=bw; cropH=bw*(arH/arW); } else { cropH=bh; cropW=bh*(arW/arH); }
  cropW/=edits.zoom; cropH/=edits.zoom;
  const maxOffX=(bw-cropW)/2, maxOffY=(bh-cropH)/2;
  const cx = bw/2 + (edits.offsetX/100)*maxOffX;
  const cy = bh/2 + (edits.offsetY/100)*maxOffY;
  const sx = Math.max(0, cx-cropW/2), sy = Math.max(0, cy-cropH/2);

  const fc = document.createElement("canvas");
  fc.width = Math.round(cropW); fc.height = Math.round(cropH);
  const fctx = fc.getContext("2d");
  fctx.drawImage(rc, sx, sy, cropW, cropH, 0, 0, cropW, cropH);

  if (edits.sharpen > 0){
    const s = edits.sharpen/100;
    const w=fc.width, h=fc.height;
    const src = fctx.getImageData(0,0,w,h);
    const out = fctx.createImageData(w,h);
    const sd=src.data, od=out.data;
    for (let y=0;y<h;y++){
      for (let x=0;x<w;x++){
        const i=(y*w+x)*4;
        if (x===0||y===0||x===w-1||y===h-1){
          od[i]=sd[i]; od[i+1]=sd[i+1]; od[i+2]=sd[i+2]; od[i+3]=sd[i+3]; continue;
        }
        for (let c2=0;c2<3;c2++){
          let sum=0;
          const k=[0,-1,0,-1,4,-1,0,-1,0]; let ki=0;
          for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
            sum += sd[((y+dy)*w+(x+dx))*4+c2]*k[ki++];
          }
          od[i+c2] = Math.max(0,Math.min(255, sd[i+c2] + s*(sum - 4*sd[i+c2])));
        }
        od[i+3]=sd[i+3];
      }
    }
    fctx.putImageData(out,0,0);
  }
  return fc.toDataURL("image/jpeg",0.95);
}

async function analyzeQuality(dataUrl, realWidth, realHeight){
  const img = await loadImage(dataUrl);
  const w=360, h=Math.round((360*img.height)/img.width);
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const ctx=c.getContext("2d"); ctx.drawImage(img,0,0,w,h);
  const { data } = ctx.getImageData(0,0,w,h);
  const gray = new Float32Array(w*h);
  let sumB=0, under=0, over=0;
  for (let i=0,p=0; i<data.length; i+=4,p++){
    const g = 0.299*data[i]+0.587*data[i+1]+0.114*data[i+2];
    gray[p]=g; sumB+=g;
    if (g<20) under++; if (g>235) over++;
  }
  const brightnessAvg = sumB/(w*h);
  const underPct=(under/(w*h))*100, overPct=(over/(w*h))*100;
  let lapSum=0, lapSumSq=0, n=0;
  for (let y=1;y<h-1;y++) for (let x=1;x<w-1;x++){
    const i=y*w+x;
    const lap = -4*gray[i]+gray[i-1]+gray[i+1]+gray[i-w]+gray[i+w];
    lapSum+=lap; lapSumSq+=lap*lap; n++;
  }
  const mean=lapSum/n, variance=lapSumSq/n - mean*mean;
  const warnings=[]; let status="ok";
  if (variance<60){ warnings.push("Berpotensi blur / kurang tajam"); status="reject"; }
  else if (variance<130){ warnings.push("Ketajaman pas-pasan, cek manual"); if(status==="ok") status="warning"; }
  if (underPct>8){ warnings.push("Area gelap gosong (underexposed)"); if(status==="ok") status="warning"; }
  if (overPct>8){ warnings.push("Area terang gosong (overexposed)"); if(status==="ok") status="warning"; }
  const mp=(realWidth*realHeight)/1000000;
  if (mp<1){ warnings.push(`Resolusi sangat kecil (${mp.toFixed(1)}MP), kemungkinan ditolak`); status="reject"; }
  else if (mp<4){ warnings.push(`Resolusi ${mp.toFixed(1)}MP, di bawah rekomendasi umum 4MP`); if(status==="ok") status="warning"; }
  return { variance:Math.round(variance), brightnessAvg:Math.round(brightnessAvg), underPct, overPct, mp, warnings, status };
}

/* ---------------- AI CALL (pakai API key milik sendiri) ---------------- */
async function generateMetadata(base64Jpeg, settings){
  const prompt = `Kamu adalah asisten metadata microstock berpengalaman (Shutterstock & Adobe Stock).
Amati gambar ini lalu hasilkan metadata SIAP UPLOAD. Balas HANYA JSON valid, tanpa markdown, tanpa teks lain, format persis:
{
 "title": "judul deskriptif singkat dalam bahasa Inggris, maks 12 kata, tanpa kata sifat berlebihan, tanpa nama merek/orang",
 "description_shutterstock": "1-2 kalimat singkat bahasa Inggris, boleh mirip/perpanjangan judul, JANGAN paragraf panjang",
 "keywords": ["25 sampai 45 keyword bahasa Inggris urut dari paling relevan ke paling umum, huruf kecil, tanpa tanda #"],
 "category_shutterstock_1": "pilih 1 dari daftar: ${SS_CATEGORIES.join(", ")}",
 "category_shutterstock_2": "pilih 1 lagi dari daftar yang sama, atau string kosong jika tidak relevan",
 "category_adobe": "pilih 1 dari daftar: ${ADOBE_CATEGORIES.join(", ")}",
 "editorial": true atau false (true jika ada logo/merek/tempat ikonik/figur publik yang membuatnya harus editorial),
 "mature_content": true atau false
}`;
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": settings.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: settings.model,
      max_tokens: 1200,
      messages: [{
        role: "user",
        content: [
          { type:"image", source:{ type:"base64", media_type:"image/jpeg", data: base64Jpeg } },
          { type:"text", text: prompt }
        ]
      }]
    })
  });
  if (!response.ok){
    const errText = await response.text();
    throw new Error(`API error ${response.status}: ${errText.slice(0,200)}`);
  }
  const data = await response.json();
  const text = (data.content||[]).map(b=>b.text||"").join("");
  const clean = text.replace(/```json|```/g,"").trim();
  return JSON.parse(clean);
}

/* ---------------- UI PIECES ---------------- */
function Meter({label, value, max, good, warn, unit=""}){
  const pct = Math.max(0, Math.min(1, value/max));
  const color = value>=good ? C.teal : value>=warn ? C.amber : C.clay;
  const r=34, circ=2*Math.PI*r;
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6}}>
      <svg width="84" height="84" viewBox="0 0 84 84">
        <circle cx="42" cy="42" r={r} fill="none" stroke={C.line} strokeWidth="7" />
        <circle cx="42" cy="42" r={r} fill="none" stroke={color} strokeWidth="7"
          strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round"
          transform="rotate(-90 42 42)" style={{transition:"stroke-dashoffset .4s ease"}} />
        <text x="42" y="46" textAnchor="middle" fill={C.paper} fontSize="15" fontFamily="'JetBrains Mono',monospace">{Math.round(value)}{unit}</text>
      </svg>
      <span style={{fontSize:11,letterSpacing:1,textTransform:"uppercase",color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}>{label}</span>
    </div>
  );
}
function StatusDot({status}){
  const map={ok:C.teal,warning:C.amber,reject:C.clay,pending:C.muted};
  const col = map[status]||C.muted;
  return <span style={{width:9,height:9,borderRadius:99,background:col,display:"inline-block",boxShadow:`0 0 8px ${col}`}} />;
}
function Slider({label,value,min,max,step=1,onChange,suffix=""}){
  return (
    <label style={{display:"block",marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.muted,marginBottom:4,fontFamily:"'JetBrains Mono',monospace"}}>
        <span>{label}</span><span>{value}{suffix}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={(e)=>onChange(Number(e.target.value))} style={{width:"100%",accentColor:C.blue}} />
    </label>
  );
}
function Chip({text,onRemove}){
  return (
    <span style={{display:"inline-flex",alignItems:"center",gap:5,background:C.panel2,border:`1px solid ${C.line}`,borderRadius:5,padding:"3px 7px",margin:"0 6px 6px 0",fontSize:12,color:C.paper,fontFamily:"'JetBrains Mono',monospace"}}>
      {text}
      <span style={{cursor:"pointer",color:C.muted}} onClick={onRemove}>{I.x}</span>
    </span>
  );
}

const DEFAULT_EDITS = { brightness:100, contrast:100, saturation:100, sharpen:0, rotate90:0, fine:0, aspect:"original", zoom:1, offsetX:0, offsetY:0 };

function loadSettings(){
  try { return JSON.parse(localStorage.getItem("kurator_stok_settings")) || { apiKey:"", model:"claude-sonnet-4-5" }; }
  catch(e){ return { apiKey:"", model:"claude-sonnet-4-5" }; }
}

/* ---------------- MAIN APP ---------------- */
function App(){
  const [items, setItems] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [settings, setSettings] = useState(loadSettings());
  const [showSettings, setShowSettings] = useState(!loadSettings().apiKey);
  const fileInput = useRef(null);
  const selected = items.find(i=>i.id===selectedId);

  const saveSettings = (s) => {
    setSettings(s);
    localStorage.setItem("kurator_stok_settings", JSON.stringify(s));
  };

  const rerender = useCallback(async (id, edits) => {
    setItems(prev => prev.map(it => it.id===id ? {...it, edits, rendering:true} : it));
    const item = items.find(i=>i.id===id);
    if (!item) return;
    const dataUrl = await renderEdited(item.workingDataUrl, edits);
    const q = await analyzeQuality(dataUrl, item.width, item.height);
    setItems(prev => prev.map(it => it.id===id ? {...it, editedDataUrl:dataUrl, quality:q, rendering:false} : it));
  }, [items]);

  const handleFiles = async (fileList) => {
    for (const file of Array.from(fileList)){
      const isVideo = file.type.startsWith("video");
      const id = uid();
      setItems(prev => [...prev, { id, name:file.name, kind: isVideo?"video":"photo", loading:true }]);
      try {
        const rawDataUrl = isVideo ? await extractVideoFrame(file) : await fileToDataURL(file);
        const capped = await capImage(rawDataUrl, 2600);
        const q = await analyzeQuality(capped.dataUrl, capped.width, capped.height);
        setItems(prev => prev.map(it => it.id===id ? {
          ...it, loading:false, workingDataUrl:capped.dataUrl, editedDataUrl:capped.dataUrl,
          width:capped.width, height:capped.height, edits:DEFAULT_EDITS, quality:q, meta:null, metaLoading:false
        } : it));
        setSelectedId(cur => cur || id);
      } catch(e){
        setItems(prev => prev.map(it => it.id===id ? {...it, loading:false, error:true} : it));
      }
    }
  };

  const updateEdits = (patch) => { if (selected) rerender(selected.id, {...selected.edits, ...patch}); };

  const runAI = async (id) => {
    if (!settings.apiKey){ setShowSettings(true); return; }
    setItems(prev => prev.map(it => it.id===id ? {...it, metaLoading:true, metaError:null} : it));
    try {
      const item = items.find(i=>i.id===id);
      const tiny = await tinyForAI(item.editedDataUrl || item.workingDataUrl);
      const meta = await generateMetadata(tiny, settings);
      setItems(prev => prev.map(it => it.id===id ? {...it, meta, metaLoading:false} : it));
    } catch(e){
      setItems(prev => prev.map(it => it.id===id ? {...it, metaLoading:false, metaError: e.message || "Gagal generate — coba lagi."} : it));
    }
  };

  const removeKeyword = (id, kw) => {
    setItems(prev => prev.map(it => it.id===id ? {...it, meta:{...it.meta, keywords:it.meta.keywords.filter(k=>k!==kw)}} : it));
  };
  const removeItem = (id) => { setItems(prev=>prev.filter(i=>i.id!==id)); if (selectedId===id) setSelectedId(null); };
  const downloadEdited = (item) => {
    const a=document.createElement("a"); a.href=item.editedDataUrl;
    a.download = item.name.replace(/\.[^.]+$/,"") + "_edited.jpg"; a.click();
  };
  const copyMeta = (item) => {
    if (!item.meta) return;
    const txt = `TITLE: ${item.meta.title}\nDESCRIPTION (Shutterstock): ${item.meta.description_shutterstock}\nKEYWORDS: ${item.meta.keywords.join(", ")}\nCATEGORY (Shutterstock): ${item.meta.category_shutterstock_1}${item.meta.category_shutterstock_2 ? ", "+item.meta.category_shutterstock_2 : ""}\nCATEGORY (Adobe): ${item.meta.category_adobe}\nEditorial: ${item.meta.editorial?"Yes":"No"} | Mature: ${item.meta.mature_content?"Yes":"No"}`;
    navigator.clipboard.writeText(txt);
  };
  const csvEscape = (s) => `"${String(s).replace(/"/g,'""')}"`;
  const exportCSV = (platform) => {
    const ready = items.filter(i=>i.meta);
    if (ready.length===0) return;
    let rows;
    if (platform==="shutterstock"){
      rows=[["Filename","Description","Keywords","Categories","Editorial","Mature content","Illustration"]];
      ready.forEach(i=>rows.push([i.name, i.meta.description_shutterstock, i.meta.keywords.join(", "),
        [i.meta.category_shutterstock_1,i.meta.category_shutterstock_2].filter(Boolean).join(", "),
        i.meta.editorial?"yes":"no", i.meta.mature_content?"yes":"no", "no"]));
    } else {
      rows=[["Filename","Title","Keywords","Category","Releases"]];
      ready.forEach(i=>rows.push([i.name, i.meta.title, i.meta.keywords.join(", "), i.meta.category_adobe, ""]));
    }
    const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\n");
    const blob = new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`metadata_${platform}.csv`; a.click();
  };

  return (
    <div style={{minHeight:"100vh",background:C.ink,color:C.paper,fontFamily:"'Inter',-apple-system,sans-serif",display:"flex",flexDirection:"column"}}>
      <header style={{padding:"18px 24px",borderBottom:`1px solid ${C.line}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
        <div>
          <h1 style={{margin:0,fontFamily:"'Space Grotesk',sans-serif",fontSize:22,letterSpacing:0.3}}>Meja Kurasi <span style={{color:C.blue}}>Stok</span></h1>
          <p style={{margin:"2px 0 0",fontSize:12.5,color:C.muted}}>Edit dasar → cek teknis → judul/deskripsi/keyword/kategori — Shutterstock & Adobe Stock</p>
        </div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setShowSettings(true)} style={{display:"flex",alignItems:"center",gap:7,background:"transparent",border:`1px solid ${C.line}`,color:C.paper,borderRadius:7,padding:"10px 14px",fontSize:13}}>{I.gear} API Key</button>
          <button onClick={()=>fileInput.current?.click()} style={{display:"flex",alignItems:"center",gap:8,background:C.blue,color:C.ink,border:"none",borderRadius:7,padding:"10px 16px",fontWeight:600,fontSize:13.5}}>{I.upload} Tambah foto / video</button>
        </div>
        <input ref={fileInput} type="file" accept="image/*,video/*" multiple hidden onChange={(e)=>e.target.files && handleFiles(e.target.files)} />
      </header>

      {showSettings && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50}} onClick={()=>setShowSettings(false)}>
          <div onClick={(e)=>e.stopPropagation()} style={{background:C.panel,border:`1px solid ${C.line}`,borderRadius:12,padding:24,width:420,maxWidth:"90vw"}}>
            <h3 style={{marginTop:0,fontFamily:"'Space Grotesk',sans-serif"}}>Pengaturan AI</h3>
            <p style={{fontSize:12.5,color:C.muted,lineHeight:1.6}}>
              Untuk fitur "Generate dgn AI" perlu API key Anthropic sendiri (dari <b>console.anthropic.com</b> → API Keys). Key disimpan hanya di browser ini (localStorage), tidak dikirim ke server lain selain api.anthropic.com.
            </p>
            <label style={{fontSize:11,color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}>API KEY</label>
            <input type="password" defaultValue={settings.apiKey} id="apikeyinput" placeholder="sk-ant-..."
              style={{width:"100%",background:C.panel2,border:`1px solid ${C.line}`,borderRadius:6,color:C.paper,padding:9,marginTop:4,marginBottom:12,fontSize:13}} />
            <label style={{fontSize:11,color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}>MODEL</label>
            <input type="text" defaultValue={settings.model} id="modelinput" placeholder="claude-sonnet-4-5"
              style={{width:"100%",background:C.panel2,border:`1px solid ${C.line}`,borderRadius:6,color:C.paper,padding:9,marginTop:4,marginBottom:16,fontSize:13}} />
            <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
              <button onClick={()=>setShowSettings(false)} style={{background:"transparent",border:`1px solid ${C.line}`,color:C.paper,borderRadius:7,padding:"9px 14px",fontSize:13}}>Batal</button>
              <button onClick={()=>{
                const apiKey = document.getElementById("apikeyinput").value.trim();
                const model = document.getElementById("modelinput").value.trim() || "claude-sonnet-4-5";
                saveSettings({apiKey, model}); setShowSettings(false);
              }} style={{background:C.teal,border:"none",color:C.ink,borderRadius:7,padding:"9px 16px",fontWeight:600,fontSize:13}}>Simpan</button>
            </div>
          </div>
        </div>
      )}

      <div style={{display:"flex",flex:1,minHeight:0}}>
        <aside style={{width:108,borderRight:`1px solid ${C.line}`,overflowY:"auto",padding:10,display:"flex",flexDirection:"column",gap:8}}>
          {items.length===0 && <div style={{fontSize:11.5,color:C.muted,textAlign:"center",marginTop:30,lineHeight:1.5}}>Belum ada file.<br/>Unggah dulu, ya.</div>}
          {items.map(it => (
            <div key={it.id} onClick={()=>setSelectedId(it.id)} style={{position:"relative",borderRadius:8,overflow:"hidden",cursor:"pointer",border: selectedId===it.id ? `2px solid ${C.blue}` : "2px solid transparent",background:C.panel}}>
              {it.loading ? (
                <div style={{height:80,display:"flex",alignItems:"center",justifyContent:"center"}}><span className="spin">◌</span></div>
              ) : it.error ? (
                <div style={{height:80,display:"flex",alignItems:"center",justifyContent:"center",color:C.clay}}>{I.x2circle}</div>
              ) : (
                <React.Fragment>
                  <img src={it.editedDataUrl} alt="" style={{width:"100%",height:80,objectFit:"cover",display:"block"}} />
                  <div style={{position:"absolute",top:4,left:4}}><StatusDot status={it.quality?.status||"pending"} /></div>
                  {it.kind==="video" && <div style={{position:"absolute",bottom:4,left:4,background:"rgba(0,0,0,.6)",borderRadius:4,padding:2}}>{I.video}</div>}
                  <button onClick={(e)=>{e.stopPropagation(); removeItem(it.id);}} style={{position:"absolute",top:2,right:2,background:"rgba(0,0,0,.55)",border:"none",borderRadius:4,color:C.paper,padding:2,lineHeight:0}}>{I.trash}</button>
                </React.Fragment>
              )}
            </div>
          ))}
        </aside>

        {!selected ? (
          <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:C.muted,fontSize:14}}>Pilih atau unggah foto/video untuk mulai kurasi.</div>
        ) : (
          <React.Fragment>
            <section style={{flex:1,overflowY:"auto",padding:20,borderRight:`1px solid ${C.line}`}}>
              {selected.kind==="video" && (
                <div style={{background:C.panel2,border:`1px solid ${C.line}`,borderRadius:8,padding:10,marginBottom:14,fontSize:12.5,color:C.amber,display:"flex",gap:8}}>
                  {I.warn} Ini frame tengah dari video (untuk analisis & metadata). Editing video tetap dikerjakan di HP/Snapseed/CapCut — unggah hasil akhirnya, gunakan tool ini hanya untuk metadata.
                </div>
              )}
              <div style={{background:C.panel,borderRadius:10,padding:12,marginBottom:16,display:"flex",justifyContent:"center"}}>
                {selected.rendering ? (
                  <div style={{height:300,display:"flex",alignItems:"center",justifyContent:"center"}}><span className="spin" style={{fontSize:22}}>◌</span></div>
                ) : (
                  <img src={selected.editedDataUrl} alt="" style={{maxWidth:"100%",maxHeight:420,borderRadius:6}} />
                )}
              </div>
              {selected.quality && (
                <div style={{display:"flex",gap:22,justifyContent:"center",background:C.panel,borderRadius:10,padding:"16px 10px",marginBottom:16}}>
                  <Meter label="Ketajaman" value={selected.quality.variance} max={250} good={130} warn={60} />
                  <Meter label="Kecerahan" value={selected.quality.brightnessAvg} max={255} good={60} warn={30} />
                  <Meter label="Resolusi" value={selected.quality.mp} max={12} good={4} warn={1} unit="MP" />
                </div>
              )}
              {selected.quality?.warnings.length > 0 && (
                <div style={{marginBottom:16}}>
                  {selected.quality.warnings.map((w,i)=>(
                    <div key={i} style={{display:"flex",gap:8,alignItems:"center",fontSize:12.5,color: selected.quality.status==="reject"?C.clay:C.amber,marginBottom:6}}>{I.warn} {w}</div>
                  ))}
                </div>
              )}
              {selected.kind!=="video" && (
                <div style={{background:C.panel,borderRadius:10,padding:16}}>
                  <h3 style={{margin:"0 0 12px",fontSize:13,letterSpacing:1,textTransform:"uppercase",color:C.muted}}>Edit dasar</h3>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}}>
                    <div>
                      <Slider label="Brightness" value={selected.edits.brightness} min={50} max={150} onChange={v=>updateEdits({brightness:v})} suffix="%" />
                      <Slider label="Contrast" value={selected.edits.contrast} min={50} max={150} onChange={v=>updateEdits({contrast:v})} suffix="%" />
                      <Slider label="Saturation" value={selected.edits.saturation} min={0} max={200} onChange={v=>updateEdits({saturation:v})} suffix="%" />
                      <Slider label="Sharpen" value={selected.edits.sharpen} min={0} max={100} onChange={v=>updateEdits({sharpen:v})} />
                    </div>
                    <div>
                      <Slider label="Luruskan (fine rotate)" value={selected.edits.fine} min={-15} max={15} step={0.5} onChange={v=>updateEdits({fine:v})} suffix="°" />
                      <div style={{display:"flex",gap:8,marginBottom:14}}>
                        <button onClick={()=>updateEdits({rotate90:(selected.edits.rotate90+90)%360})} style={{flex:1,background:C.panel2,border:`1px solid ${C.line}`,borderRadius:6,padding:"8px 0",color:C.paper,display:"flex",alignItems:"center",justifyContent:"center",gap:6,fontSize:12.5}}>{I.rotate} Putar 90°</button>
                      </div>
                      <label style={{display:"block",fontSize:12,color:C.muted,marginBottom:6,fontFamily:"'JetBrains Mono',monospace"}}>Rasio crop</label>
                      <select value={selected.edits.aspect} onChange={e=>updateEdits({aspect:e.target.value})} style={{width:"100%",background:C.panel2,border:`1px solid ${C.line}`,color:C.paper,borderRadius:6,padding:8,marginBottom:10}}>
                        <option value="original">Asli</option><option value="1:1">1:1</option><option value="4:3">4:3</option>
                        <option value="3:2">3:2</option><option value="16:9">16:9</option><option value="9:16">9:16</option>
                      </select>
                      <Slider label="Zoom crop" value={selected.edits.zoom} min={1} max={2} step={0.05} onChange={v=>updateEdits({zoom:v})} suffix="×" />
                    </div>
                  </div>
                </div>
              )}
              <button onClick={()=>downloadEdited(selected)} style={{marginTop:16,display:"flex",alignItems:"center",gap:8,background:"transparent",border:`1px solid ${C.line}`,color:C.paper,borderRadius:7,padding:"9px 14px",fontSize:13}}>{I.download} Unduh foto hasil edit</button>
            </section>

            <section style={{width:380,overflowY:"auto",padding:20}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                <h3 style={{margin:0,fontSize:13,letterSpacing:1,textTransform:"uppercase",color:C.muted}}>Metadata</h3>
                <button onClick={()=>runAI(selected.id)} disabled={selected.metaLoading} style={{display:"flex",alignItems:"center",gap:7,background:C.teal,color:C.ink,border:"none",borderRadius:7,padding:"8px 12px",fontWeight:600,fontSize:12.5}}>
                  {selected.metaLoading ? <span className="spin">◌</span> : I.sparkles} {selected.meta ? "Generate ulang" : "Generate dgn AI"}
                </button>
              </div>
              {selected.metaError && <div style={{color:C.clay,fontSize:12.5,marginBottom:10}}>{selected.metaError}</div>}
              {!selected.meta && !selected.metaLoading && (
                <div style={{fontSize:12.5,color:C.muted,lineHeight:1.6}}>Klik "Generate dgn AI" untuk membuat judul, deskripsi, keyword, dan kategori otomatis dari foto ini.</div>
              )}
              {selected.meta && (
                <div style={{display:"flex",flexDirection:"column",gap:14}}>
                  <div>
                    <label style={{fontSize:11,color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}>TITLE</label>
                    <input type="text" value={selected.meta.title} onChange={e=>setItems(prev=>prev.map(it=>it.id===selected.id?{...it,meta:{...it.meta,title:e.target.value}}:it))}
                      style={{width:"100%",background:C.panel2,border:`1px solid ${C.line}`,borderRadius:6,color:C.paper,padding:8,marginTop:4,fontSize:13}} />
                  </div>
                  <div>
                    <label style={{fontSize:11,color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}>DESCRIPTION (Shutterstock)</label>
                    <textarea rows={2} value={selected.meta.description_shutterstock} onChange={e=>setItems(prev=>prev.map(it=>it.id===selected.id?{...it,meta:{...it.meta,description_shutterstock:e.target.value}}:it))}
                      style={{width:"100%",background:C.panel2,border:`1px solid ${C.line}`,borderRadius:6,color:C.paper,padding:8,marginTop:4,fontSize:13,resize:"vertical"}} />
                  </div>
                  <div>
                    <label style={{fontSize:11,color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}>CATEGORY — SHUTTERSTOCK</label>
                    <div style={{display:"flex",gap:8,marginTop:4}}>
                      <select value={selected.meta.category_shutterstock_1} onChange={e=>setItems(prev=>prev.map(it=>it.id===selected.id?{...it,meta:{...it.meta,category_shutterstock_1:e.target.value}}:it))}
                        style={{flex:1,background:C.panel2,border:`1px solid ${C.line}`,color:C.paper,borderRadius:6,padding:7,fontSize:12.5}}>
                        {SS_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
                      </select>
                      <select value={selected.meta.category_shutterstock_2} onChange={e=>setItems(prev=>prev.map(it=>it.id===selected.id?{...it,meta:{...it.meta,category_shutterstock_2:e.target.value}}:it))}
                        style={{flex:1,background:C.panel2,border:`1px solid ${C.line}`,color:C.paper,borderRadius:6,padding:7,fontSize:12.5}}>
                        <option value="">—</option>{SS_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>
                  </div>
                  <div>
                    <label style={{fontSize:11,color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}>CATEGORY — ADOBE STOCK</label>
                    <select value={selected.meta.category_adobe} onChange={e=>setItems(prev=>prev.map(it=>it.id===selected.id?{...it,meta:{...it.meta,category_adobe:e.target.value}}:it))}
                      style={{width:"100%",background:C.panel2,border:`1px solid ${C.line}`,color:C.paper,borderRadius:6,padding:7,marginTop:4,fontSize:12.5}}>
                      {ADOBE_CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}
                    </select>
                  </div>
                  <div>
                    <label style={{fontSize:11,color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}>KEYWORDS ({selected.meta.keywords.length})</label>
                    <div style={{marginTop:6}}>{selected.meta.keywords.map(k=><Chip key={k} text={k} onRemove={()=>removeKeyword(selected.id,k)} />)}</div>
                  </div>
                  <div style={{display:"flex",gap:16,fontSize:12.5,color:C.muted}}>
                    <span>Editorial: <b style={{color: selected.meta.editorial?C.amber:C.teal}}>{selected.meta.editorial?"Ya":"Tidak"}</b></span>
                    <span>Mature: <b style={{color: selected.meta.mature_content?C.amber:C.teal}}>{selected.meta.mature_content?"Ya":"Tidak"}</b></span>
                  </div>
                  <button onClick={()=>copyMeta(selected)} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,background:"transparent",border:`1px solid ${C.line}`,color:C.paper,borderRadius:7,padding:"9px 0",fontSize:13}}>{I.copy} Salin metadata</button>
                </div>
              )}
            </section>
          </React.Fragment>
        )}
      </div>

      <footer style={{borderTop:`1px solid ${C.line}`,padding:"12px 24px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
        <span style={{fontSize:12,color:C.muted}}>{items.filter(i=>i.meta).length} dari {items.length} file punya metadata siap export</span>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>exportCSV("shutterstock")} style={{display:"flex",alignItems:"center",gap:7,background:C.panel2,border:`1px solid ${C.line}`,color:C.paper,borderRadius:7,padding:"9px 14px",fontSize:12.5}}>{I.filedown} CSV Shutterstock</button>
          <button onClick={()=>exportCSV("adobe")} style={{display:"flex",alignItems:"center",gap:7,background:C.panel2,border:`1px solid ${C.line}`,color:C.paper,borderRadius:7,padding:"9px 14px",fontSize:12.5}}>{I.filedown} CSV Adobe Stock</button>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
