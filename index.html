<script>
"use strict";
var e = React.createElement;

/* ---------------- TOKENS ---------------- */
var C = {
  ink:"#14181C", panel:"#1B2126", panel2:"#20272D", line:"#2C343B",
  paper:"#EDEAE2", muted:"#8B939B", teal:"#3FA79E", amber:"#DFA23A", clay:"#C1503B", blue:"#5B8FBE"
};
var SS_CATEGORIES = ["Abstract","Animals/Wildlife","Arts","Backgrounds/Textures","Beauty/Fashion","Buildings/Landmarks","Business/Finance","Celebrities","Education","Food and drink","Healthcare/Medical","Holidays","Industrial","Interiors","Miscellaneous","Nature","Objects","Parks/Outdoor","People","Religion","Science","Signs/Symbols","Sports/Recreation","Technology","Transportation","Vintage"];
var ADOBE_CATEGORIES = ["Animals","Buildings and Architecture","Business","Drinks","The Environment","States of Mind","Food","Graphic Resources","Hobbies and Leisure","Industry","Landscapes","Lifestyle","People","Plants and Flowers","Culture and Religion","Science","Social Issues","Sports","Technology","Transport","Travel"];
var uid = function(){ return Math.random().toString(36).slice(2,10); };

/* ---------------- ICONS ---------------- */
function Icon(props){ return e("span", {style:{fontSize:props.size||15,lineHeight:1,display:"inline-flex"}}, props.children); }

  upload:  e(Icon,{},"⬆️"), video: e(Icon,{size:12},"🎬"), sparkles: e(Icon,{},"✨"),
  download:e(Icon,{},"⬇️"), copy: e(Icon,{},"📋"), rotate: e(Icon,{},"↻"),

};

/* ---------------- IMAGE / CANVAS HELPERS ---------------- */
function loadImage(src){ return new Promise(function(res,rej){ var img=new Image(); img.onload=function(){res(img);}; img.onerror=rej; img.src=src; }); }
function fileToDataURL(file){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.onerror=rej; r.readAsDataURL(file); }); }

async function capImage(dataUrl, maxSide){
  maxSide = maxSide || 2600;
  var img = await loadImage(dataUrl);
  var scale = Math.min(1, maxSide/Math.max(img.width,img.height));
  var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
  var c = document.createElement("canvas"); c.width=w; c.height=h;
  c.getContext("2d").drawImage(img,0,0,w,h);
  return { dataUrl: c.toDataURL("image/jpeg",0.95), width:w, height:h };
}
async function tinyForAI(dataUrl, maxSide){
  maxSide = maxSide || 900;
  var img = await loadImage(dataUrl);
  var scale = Math.min(1, maxSide/Math.max(img.width,img.height));
  var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
  var c = document.createElement("canvas"); c.width=w; c.height=h;
  c.getContext("2d").drawImage(img,0,0,w,h);
  return c.toDataURL("image/jpeg",0.8).split(",")[1];
}
async function extractVideoFrame(file){
  var url = URL.createObjectURL(file);
  var video = document.createElement("video");
  video.src = url; video.muted = true;
  await new Promise(function(res){ video.onloadedmetadata = res; });
  video.currentTime = Math.min(video.duration/2, video.duration-0.05);
  await new Promise(function(res){ video.onseeked = res; });
  var c = document.createElement("canvas");
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext("2d").drawImage(video,0,0);
  URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg",0.92);
}

async function renderEdited(workingDataUrl, edits){
  var img = await loadImage(workingDataUrl);
  var angle = ((edits.rotate90 + edits.fine) * Math.PI) / 180;
  var rad = Math.abs(angle);
  var bw = Math.abs(img.width*Math.cos(rad)) + Math.abs(img.height*Math.sin(rad));
  var bh = Math.abs(img.width*Math.sin(rad)) + Math.abs(img.height*Math.cos(rad));
  var rc = document.createElement("canvas"); rc.width=bw; rc.height=bh;
  var rctx = rc.getContext("2d");
  rctx.translate(bw/2,bh/2); rctx.rotate(angle);
  rctx.filter = "brightness("+edits.brightness+"%) contrast("+edits.contrast+"%) saturate("+edits.saturation+"%)";
  rctx.drawImage(img, -img.width/2, -img.height/2);

  var arParts = edits.aspect==="original" ? [bw,bh] : edits.aspect.split(":").map(Number);
  var arW = arParts[0], arH = arParts[1];
  var cropW,cropH;
  if (arW/arH > bw/bh){ cropW=bw; cropH=bw*(arH/arW); } else { cropH=bh; cropW=bh*(arW/arH); }
  cropW/=edits.zoom; cropH/=edits.zoom;
  var maxOffX=(bw-cropW)/2, maxOffY=(bh-cropH)/2;
  var cx = bw/2 + (edits.offsetX/100)*maxOffX;
  var cy = bh/2 + (edits.offsetY/100)*maxOffY;
  var sx = Math.max(0, cx-cropW/2), sy = Math.max(0, cy-cropH/2);

  var fc = document.createElement("canvas");
  fc.width = Math.round(cropW); fc.height = Math.round(cropH);
  var fctx = fc.getContext("2d");
  fctx.drawImage(rc, sx, sy, cropW, cropH, 0, 0, cropW, cropH);

  if (edits.sharpen > 0){
    var s = edits.sharpen/100;
    var w=fc.width, h=fc.height;
    var src = fctx.getImageData(0,0,w,h);
    var out = fctx.createImageData(w,h);
    var sd=src.data, od=out.data;
    for (var y=0;y<h;y++){
      for (var x=0;x<w;x++){
        var i=(y*w+x)*4;
        if (x===0||y===0||x===w-1||y===h-1){
          od[i]=sd[i]; od[i+1]=sd[i+1]; od[i+2]=sd[i+2]; od[i+3]=sd[i+3]; continue;
        }
        for (var c2=0;c2<3;c2++){
          var sum=0;
          var k=[0,-1,0,-1,4,-1,0,-1,0]; var ki=0;
          for (var dy=-1;dy<=1;dy++) for (var dx=-1;dx<=1;dx++){
            sum += sd[((y+dy)*w+(x+dx))*4+c2]*k[ki++];
          }
          od[i+c2] = Math.max(0,Math.min(255, sd[i+c2] + s*(sum - 4*sd[i+c2])));
        }
        od[i+3]=sd[i+3];
      }
    }
    fctx.putImageData(out,0,0);
  }
  return fc.toDataURL("image/jpeg",0.95);
}

async function analyzeQuality(dataUrl, realWidth, realHeight){
  var img = await loadImage(dataUrl);
  var w=360, h=Math.round((360*img.height)/img.width);
  var c=document.createElement("canvas"); c.width=w; c.height=h;
  var ctx=c.getContext("2d"); ctx.drawImage(img,0,0,w,h);
  var data = ctx.getImageData(0,0,w,h).data;
  var gray = new Float32Array(w*h);
  var sumB=0, under=0, over=0;
  for (var i=0,p=0; i<data.length; i+=4,p++){
    var g = 0.299*data[i]+0.587*data[i+1]+0.114*data[i+2];
    gray[p]=g; sumB+=g;
    if (g<20) under++; if (g>235) over++;
  }
  var brightnessAvg = sumB/(w*h);
  var underPct=(under/(w*h))*100, overPct=(over/(w*h))*100;
  var lapSum=0, lapSumSq=0, n=0;
  for (var y=1;y<h-1;y++) for (var x=1;x<w-1;x++){
    var idx=y*w+x;
    var lap = -4*gray[idx]+gray[idx-1]+gray[idx+1]+gray[idx-w]+gray[idx+w];
    lapSum+=lap; lapSumSq+=lap*lap; n++;
  }
  var mean=lapSum/n, variance=lapSumSq/n - mean*mean;
  var warnings=[]; var status="ok";
  if (variance<60){ warnings.push("Berpotensi blur / kurang tajam"); status="reject"; }
  else if (variance<130){ warnings.push("Ketajaman pas-pasan, cek manual"); if(status==="ok") status="warning"; }
  if (underPct>8){ warnings.push("Area gelap gosong (underexposed)"); if(status==="ok") status="warning"; }
  if (overPct>8){ warnings.push("Area terang gosong (overexposed)"); if(status==="ok") status="warning"; }
  var mp=(realWidth*realHeight)/1000000;
  if (mp<1){ warnings.push("Resolusi sangat kecil ("+mp.toFixed(1)+"MP), kemungkinan ditolak"); status="reject"; }
  else if (mp<4){ warnings.push("Resolusi "+mp.toFixed(1)+"MP, di bawah rekomendasi umum 4MP"); if(status==="ok") status="warning"; }
  return { variance:Math.round(variance), brightnessAvg:Math.round(brightnessAvg), underPct:underPct, overPct:overPct, mp:mp, warnings:warnings, status:status };
}

/* ---------------- AI CALL ---------------- */
async function generateMetadata(base64Jpeg, settings){
  var prompt = 'Kamu adalah asisten metadata microstock berpengalaman (Shutterstock & Adobe Stock).\n' +
'Amati gambar ini lalu hasilkan metadata SIAP UPLOAD. Balas HANYA JSON valid, tanpa markdown, tanpa teks lain, format persis:\n' +
'{\n' +
' "title": "judul deskriptif singkat dalam bahasa Inggris, maks 12 kata, tanpa kata sifat berlebihan, tanpa nama merek/orang",\n' +
' "description_shutterstock": "1-2 kalimat singkat bahasa Inggris, boleh mirip/perpanjangan judul, JANGAN paragraf panjang",\n' +
' "keywords": ["25 sampai 45 keyword bahasa Inggris urut dari paling relevan ke paling umum, huruf kecil, tanpa tanda #"],\n' +
' "category_shutterstock_1": "pilih 1 dari daftar: ' + SS_CATEGORIES.join(", ") + '",\n' +
' "category_shutterstock_2": "pilih 1 lagi dari daftar yang sama, atau string kosong jika tidak relevan",\n' +
' "category_adobe": "pilih 1 dari daftar: ' + ADOBE_CATEGORIES.join(", ") + '",\n' +
' "editorial": true atau false (true jika ada logo/merek/tempat ikonik/figur publik yang membuatnya harus editorial),\n' +
' "mature_content": true atau false\n' +
'}';
  var response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": settings.apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: settings.model,
      max_tokens: 1200,
      messages: [{
        role: "user",
        content: [
          { type:"image", source:{ type:"base64", media_type:"image/jpeg", data: base64Jpeg } },
          { type:"text", text: prompt }
        ]
      }]
    })
  });
  if (!response.ok){
    var errText = await response.text();
    throw new Error("API error " + response.status + ": " + errText.slice(0,200));
  }
  var data = await response.json();
  var text = (data.content||[]).map(function(b){ return b.text||""; }).join("");
  var clean = text.replace(/```json|```/g,"").trim();
  return JSON.parse(clean);
}

/* ---------------- UI PIECES ---------------- */
function Meter(props){
  var label=props.label, value=props.value, max=props.max, good=props.good, warn=props.warn, unit=props.unit||"";
  var pct = Math.max(0, Math.min(1, value/max));
  var color = value>=good ? C.teal : value>=warn ? C.amber : C.clay;
  var r=34, circ=2*Math.PI*r;
  return e("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:6}},
    e("svg",{width:84,height:84,viewBox:"0 0 84 84"},
      e("circle",{cx:42,cy:42,r:r,fill:"none",stroke:C.line,strokeWidth:7}),
      e("circle",{cx:42,cy:42,r:r,fill:"none",stroke:color,strokeWidth:7,
        strokeDasharray:circ, strokeDashoffset:circ*(1-pct), strokeLinecap:"round",
        transform:"rotate(-90 42 42)", style:{transition:"stroke-dashoffset .4s ease"}}),
      e("text",{x:42,y:46,textAnchor:"middle",fill:C.paper,fontSize:15,fontFamily:"'JetBrains Mono',monospace"}, Math.round(value)+unit)
    ),
    e("span",{style:{fontSize:11,letterSpacing:1,textTransform:"uppercase",color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}, label)
  );
}
function StatusDot(props){
  var map={ok:C.teal,warning:C.amber,reject:C.clay,pending:C.muted};
  var col = map[props.status]||C.muted;
  return e("span",{style:{width:9,height:9,borderRadius:99,background:col,display:"inline-block",boxShadow:"0 0 8px "+col}});
}
function Slider(props){
  return e("label",{style:{display:"block",marginBottom:14}},
    e("div",{style:{display:"flex",justifyContent:"space-between",fontSize:12,color:C.muted,marginBottom:4,fontFamily:"'JetBrains Mono',monospace"}},
      e("span",{},props.label), e("span",{},props.value+(props.suffix||""))
    ),
    e("input",{type:"range",min:props.min,max:props.max,step:props.step||1,value:props.value,
      onChange:function(ev){ props.onChange(Number(ev.target.value)); }, style:{width:"100%",accentColor:C.blue}})
  );
}
function Chip(props){
  return e("span",{style:{display:"inline-flex",alignItems:"center",gap:5,background:C.panel2,border:"1px solid "+C.line,borderRadius:5,padding:"3px 7px",margin:"0 6px 6px 0",fontSize:12,color:C.paper,fontFamily:"'JetBrains Mono',monospace"}},
    props.text,
    e("span",{style:{cursor:"pointer",color:C.muted},onClick:props.onRemove}, I.x)
  );
}

var DEFAULT_EDITS = { brightness:100, contrast:100, saturation:100, sharpen:0, rotate90:0, fine:0, aspect:"original", zoom:1, offsetX:0, offsetY:0 };

function loadSettings(){
  try { return JSON.parse(localStorage.getItem("kurator_stok_settings")) || { apiKey:"", model:"claude-sonnet-4-5" }; }
  catch(e2){ return { apiKey:"", model:"claude-sonnet-4-5" }; }
}

/* ---------------- MAIN APP ---------------- */
function useIsNarrow(){
  var useState = React.useState, useEffect = React.useEffect;
  var st = useState(window.innerWidth < 860);
  useEffect(function(){
    function onResize(){ st[1](window.innerWidth < 860); }
    window.addEventListener("resize", onResize);
    return function(){ window.removeEventListener("resize", onResize); };
  }, []);
  return st[0];
}

function App(){
  var useState = React.useState, useRef = React.useRef, useCallback = React.useCallback;
  var isNarrow = useIsNarrow();
  var itemsState = useState([]); var items = itemsState[0], setItems = itemsState[1];
  var selState = useState(null); var selectedId = selState[0], setSelectedId = selState[1];
  var initSettings = loadSettings();
  var settingsState = useState(initSettings); var settings = settingsState[0], setSettingsRaw = settingsState[1];
  var showSettingsState = useState(!initSettings.apiKey); var showSettings = showSettingsState[0], setShowSettings = showSettingsState[1];

  var selected = null;
  for (var si=0; si<items.length; si++){ if (items[si].id===selectedId){ selected = items[si]; break; } }

  function saveSettings(s){ setSettingsRaw(s); localStorage.setItem("kurator_stok_settings", JSON.stringify(s)); }

  var rerender = useCallback(function(id, edits){
    setItems(function(prev){ return prev.map(function(it){ return it.id===id ? Object.assign({},it,{edits:edits,rendering:true}) : it; }); });
    var item = null;
    for (var k=0;k<items.length;k++){ if (items[k].id===id){ item=items[k]; break; } }
    if (!item) return;
    renderEdited(item.workingDataUrl, edits).then(function(dataUrl){
      return analyzeQuality(dataUrl, item.width, item.height).then(function(q){
        setItems(function(prev){ return prev.map(function(it){ return it.id===id ? Object.assign({},it,{editedDataUrl:dataUrl,quality:q,rendering:false}) : it; }); });
      });
    });
  }, [items]);

  async function handleFiles(fileList){
    var files = Array.from(fileList);
    for (var fi=0; fi<files.length; fi++){
      (function(file){
        var isVideo = file.type.indexOf("video")===0;
        var id = uid();
        setItems(function(prev){ return prev.concat([{ id:id, name:file.name, kind: isVideo?"video":"photo", loading:true }]); });
        (async function(){
          try {
            var rawDataUrl = isVideo ? await extractVideoFrame(file) : await fileToDataURL(file);
            var capped = await capImage(rawDataUrl, 2600);
            var q = await analyzeQuality(capped.dataUrl, capped.width, capped.height);
            setItems(function(prev){ return prev.map(function(it){ return it.id===id ? Object.assign({},it,{
              loading:false, workingDataUrl:capped.dataUrl, editedDataUrl:capped.dataUrl,
              width:capped.width, height:capped.height, edits:DEFAULT_EDITS, quality:q, meta:null, metaLoading:false
            }) : it; }); });
            setSelectedId(function(cur){ return cur || id; });
          } catch(err){
            setItems(function(prev){ return prev.map(function(it){ return it.id===id ? Object.assign({},it,{loading:false,error:true}) : it; }); });
          }
        })();
      })(files[fi]);
    }
  }

  function updateEdits(patch){ if (selected) rerender(selected.id, Object.assign({}, selected.edits, patch)); }

  async function runAI(id){
    if (!settings.apiKey){ setShowSettings(true); return; }
    setItems(function(prev){ return prev.map(function(it){ return it.id===id ? Object.assign({},it,{metaLoading:true,metaError:null}) : it; }); });
    try {
      var item = null;
      for (var k=0;k<items.length;k++){ if (items[k].id===id){ item=items[k]; break; } }
      var tiny = await tinyForAI(item.editedDataUrl || item.workingDataUrl);
      var meta = await generateMetadata(tiny, settings);
      setItems(function(prev){ return prev.map(function(it){ return it.id===id ? Object.assign({},it,{meta:meta,metaLoading:false}) : it; }); });
    } catch(err){
      setItems(function(prev){ return prev.map(function(it){ return it.id===id ? Object.assign({},it,{metaLoading:false,metaError: err.message || "Gagal generate — coba lagi."}) : it; }); });
    }
  }

  function removeKeyword(id, kw){
    setItems(function(prev){ return prev.map(function(it){
      if (it.id!==id) return it;
      var newMeta = Object.assign({}, it.meta, { keywords: it.meta.keywords.filter(function(k){ return k!==kw; }) });
      return Object.assign({}, it, {meta:newMeta});
    }); });
  }
  function removeItem(id){ setItems(function(prev){ return prev.filter(function(i){ return i.id!==id; }); }); if (selectedId===id) setSelectedId(null); }
  function downloadEdited(item){
    var a=document.createElement("a"); a.href=item.editedDataUrl;
    a.download = item.name.replace(/\.[^.]+$/,"") + "_edited.jpg"; a.click();
  }
  function copyMeta(item){
    if (!item.meta) return;
    var txt = "TITLE: "+item.meta.title+"\nDESCRIPTION (Shutterstock): "+item.meta.description_shutterstock+
      "\nKEYWORDS: "+item.meta.keywords.join(", ")+
      "\nCATEGORY (Shutterstock): "+item.meta.category_shutterstock_1+(item.meta.category_shutterstock_2 ? ", "+item.meta.category_shutterstock_2 : "")+
      "\nCATEGORY (Adobe): "+item.meta.category_adobe+
      "\nEditorial: "+(item.meta.editorial?"Yes":"No")+" | Mature: "+(item.meta.mature_content?"Yes":"No");
    navigator.clipboard.writeText(txt);
  }
  function csvEscape(s){ return '"'+String(s).replace(/"/g,'""')+'"'; }
  function exportCSV(platform){
    var ready = items.filter(function(i){ return i.meta; });
    if (ready.length===0) return;
    var rows;
    if (platform==="shutterstock"){
      rows=[["Filename","Description","Keywords","Categories","Editorial","Mature content","Illustration"]];
      ready.forEach(function(i){ rows.push([i.name, i.meta.description_shutterstock, i.meta.keywords.join(", "),
        [i.meta.category_shutterstock_1,i.meta.category_shutterstock_2].filter(Boolean).join(", "),
        i.meta.editorial?"yes":"no", i.meta.mature_content?"yes":"no", "no"]); });
    } else {
      rows=[["Filename","Title","Keywords","Category","Releases"]];
      ready.forEach(function(i){ rows.push([i.name, i.meta.title, i.meta.keywords.join(", "), i.meta.category_adobe, ""]); });
    }
    var csv = rows.map(function(r){ return r.map(csvEscape).join(","); }).join("\n");
    var blob = new Blob([csv],{type:"text/csv;charset=utf-8;"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="metadata_"+platform+".csv"; a.click();
  }

  function setMetaField(id, field, value){
    setItems(function(prev){ return prev.map(function(it){
      if (it.id!==id) return it;
      var nm = Object.assign({}, it.meta); nm[field]=value;
      return Object.assign({}, it, {meta:nm});
    }); });
  }

  /* ---- header ---- */
  var header = e("header",{style:{padding: isNarrow?"14px 16px":"18px 24px",borderBottom:"1px solid "+C.line,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}},
    e("div",{},
      e("h1",{style:{margin:0,fontFamily:"'Space Grotesk',sans-serif",fontSize:22,letterSpacing:0.3}}, "Meja Kurasi ", e("span",{style:{color:C.blue}},"Stok")),
      e("p",{style:{margin:"2px 0 0",fontSize:12.5,color:C.muted}}, "Edit dasar → cek teknis → judul/deskripsi/keyword/kategori — Shutterstock & Adobe Stock")
    ),
    e("div",{style:{display:"flex",gap:10}},
      e("button",{onClick:function(){setShowSettings(true);}, style:{display:"flex",alignItems:"center",gap:7,background:"transparent",border:"1px solid "+C.line,color:C.paper,borderRadius:7,padding:"10px 14px",fontSize:13}}, I.gear, " API Key"),
      e("label",{style:{display:"flex",alignItems:"center",gap:8,background:C.blue,color:C.ink,border:"none",borderRadius:7,padding:"10px 16px",fontWeight:600,fontSize:13.5,cursor:"pointer"}},
        I.upload, " Tambah foto / video",
        e("input",{type:"file",accept:"image/*,video/*",multiple:true,
          style:{position:"absolute",width:1,height:1,opacity:0,pointerEvents:"none"},
          onChange:function(ev){ if (ev.target.files && ev.target.files.length) handleFiles(ev.target.files); ev.target.value=""; }})
      )
    )
  );

  /* ---- settings modal ---- */
  var settingsModal = !showSettings ? null : e("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:50}, onClick:function(){setShowSettings(false);}},
    e("div",{onClick:function(ev){ev.stopPropagation();}, style:{background:C.panel,border:"1px solid "+C.line,borderRadius:12,padding:24,width:420,maxWidth:"90vw"}},
      e("h3",{style:{marginTop:0,fontFamily:"'Space Grotesk',sans-serif"}}, "Pengaturan AI"),
      e("p",{style:{fontSize:12.5,color:C.muted,lineHeight:1.6}}, "Untuk fitur \"Generate dgn AI\" perlu API key Anthropic sendiri (dari console.anthropic.com → API Keys). Key disimpan hanya di browser ini (localStorage), tidak dikirim ke server lain selain api.anthropic.com."),
      e("label",{style:{fontSize:11,color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}, "API KEY"),
      e("input",{type:"password", defaultValue:settings.apiKey, id:"apikeyinput", placeholder:"sk-ant-...",
        style:{width:"100%",background:C.panel2,border:"1px solid "+C.line,borderRadius:6,color:C.paper,padding:9,marginTop:4,marginBottom:12,fontSize:13}}),
      e("label",{style:{fontSize:11,color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}, "MODEL"),
      e("input",{type:"text", defaultValue:settings.model, id:"modelinput", placeholder:"claude-sonnet-4-5",
        style:{width:"100%",background:C.panel2,border:"1px solid "+C.line,borderRadius:6,color:C.paper,padding:9,marginTop:4,marginBottom:16,fontSize:13}}),
      e("div",{style:{display:"flex",gap:10,justifyContent:"flex-end"}},
        e("button",{onClick:function(){setShowSettings(false);}, style:{background:"transparent",border:"1px solid "+C.line,color:C.paper,borderRadius:7,padding:"9px 14px",fontSize:13}}, "Batal"),
        e("button",{onClick:function(){
          var apiKey = document.getElementById("apikeyinput").value.trim();
          var model = document.getElementById("modelinput").value.trim() || "claude-sonnet-4-5";
          saveSettings({apiKey:apiKey, model:model}); setShowSettings(false);
        }, style:{background:C.teal,border:"none",color:C.ink,borderRadius:7,padding:"9px 16px",fontWeight:600,fontSize:13}}, "Simpan")
      )
    )
  );

  /* ---- filmstrip ---- */
  var filmstrip = e("aside",{style: isNarrow ?
      {width:"100%",borderBottom:"1px solid "+C.line,overflowX:"auto",overflowY:"hidden",padding:10,display:"flex",flexDirection:"row",gap:8}
      : {width:108,borderRight:"1px solid "+C.line,overflowY:"auto",padding:10,display:"flex",flexDirection:"column",gap:8}},
    items.length===0 ? e("div",{style:{fontSize:11.5,color:C.muted,textAlign:"center",padding:"10px 4px",lineHeight:1.5, whiteSpace: isNarrow ? "nowrap" : "normal"}}, "Belum ada file. Unggah dulu, ya.") : null,
    items.map(function(it){
      var inner;
      if (it.loading){
        inner = e("div",{style:{height:80,display:"flex",alignItems:"center",justifyContent:"center"}}, e("span",{className:"spin"},"◌"));
      } else if (it.error){
        inner = e("div",{style:{height:80,display:"flex",alignItems:"center",justifyContent:"center",color:C.clay}}, I.x2circle);
      } else {
        inner = e(React.Fragment,{},
          e("img",{src:it.editedDataUrl, alt:"", style:{width:"100%",height:80,objectFit:"cover",display:"block"}}),
          e("div",{style:{position:"absolute",top:4,left:4}}, e(StatusDot,{status:(it.quality&&it.quality.status)||"pending"})),
          it.kind==="video" ? e("div",{style:{position:"absolute",bottom:4,left:4,background:"rgba(0,0,0,.6)",borderRadius:4,padding:2}}, I.video) : null,
          e("button",{onClick:function(ev){ev.stopPropagation(); removeItem(it.id);}, style:{position:"absolute",top:2,right:2,background:"rgba(0,0,0,.55)",border:"none",borderRadius:4,color:C.paper,padding:2,lineHeight:0}}, I.trash)
        );
      }
      return e("div",{key:it.id, onClick:function(){setSelectedId(it.id);}, style:{position:"relative",borderRadius:8,overflow:"hidden",cursor:"pointer",flexShrink:0,width: isNarrow?72:"auto",border: selectedId===it.id ? "2px solid "+C.blue : "2px solid transparent",background:C.panel}}, inner);
    })
  );

  /* ---- main workbench ---- */
  var workbench;
  if (!selected){
    workbench = e("div",{style:{flex:1,display:"flex",alignItems:"center",justifyContent:"center",color:C.muted,fontSize:14}}, "Pilih atau unggah foto/video untuk mulai kurasi.");

    var editSection = e("section",{style:{flex:1,overflowY:"auto",padding: isNarrow?14:20, borderRight: isNarrow?"none":"1px solid "+C.line, borderBottom: isNarrow?"1px solid "+C.line:"none"}},
      selected.kind==="video" ? e("div",{style:{background:C.panel2,border:"1px solid "+C.line,borderRadius:8,padding:10,marginBottom:14,fontSize:12.5,color:C.amber,display:"flex",gap:8}}, I.warn, " Ini frame tengah dari video (untuk analisis & metadata). Editing video tetap dikerjakan di HP/Snapseed/CapCut — unggah hasil akhirnya, gunakan tool ini hanya untuk metadata.") : null,
      e("div",{style:{background:C.panel,borderRadius:10,padding:12,marginBottom:16,display:"flex",justifyContent:"center"}},
        selected.rendering ? e("div",{style:{height:300,display:"flex",alignItems:"center",justifyContent:"center"}}, e("span",{className:"spin",style:{fontSize:22}},"◌")) :
          e("img",{src:selected.editedDataUrl, alt:"", style:{maxWidth:"100%",maxHeight:420,borderRadius:6}})
      ),
      selected.quality ? e("div",{style:{display:"flex",gap: isNarrow?10:22,justifyContent:"center",flexWrap:"wrap",background:C.panel,borderRadius:10,padding:"16px 10px",marginBottom:16}},
        e(Meter,{label:"Ketajaman", value:selected.quality.variance, max:250, good:130, warn:60}),
        e(Meter,{label:"Kecerahan", value:selected.quality.brightnessAvg, max:255, good:60, warn:30}),
        e(Meter,{label:"Resolusi", value:selected.quality.mp, max:12, good:4, warn:1, unit:"MP"})
      ) : null,
      (selected.quality && selected.quality.warnings.length>0) ? e("div",{style:{marginBottom:16}},
        selected.quality.warnings.map(function(w,wi){
          return e("div",{key:wi, style:{display:"flex",gap:8,alignItems:"center",fontSize:12.5,color: selected.quality.status==="reject"?C.clay:C.amber,marginBottom:6}}, I.warn, " ", w);
        })
      ) : null,
      selected.kind!=="video" ? e("div",{style:{background:C.panel,borderRadius:10,padding:16}},
        e("h3",{style:{margin:"0 0 12px",fontSize:13,letterSpacing:1,textTransform:"uppercase",color:C.muted}}, "Edit dasar"),
        e("div",{style:{display:"grid",gridTemplateColumns: isNarrow?"1fr":"1fr 1fr",gap:20}},
          e("div",{},
            e(Slider,{label:"Brightness", value:selected.edits.brightness, min:50, max:150, onChange:function(v){updateEdits({brightness:v});}, suffix:"%"}),
            e(Slider,{label:"Contrast", value:selected.edits.contrast, min:50, max:150, onChange:function(v){updateEdits({contrast:v});}, suffix:"%"}),
            e(Slider,{label:"Saturation", value:selected.edits.saturation, min:0, max:200, onChange:function(v){updateEdits({saturation:v});}, suffix:"%"}),
            e(Slider,{label:"Sharpen", value:selected.edits.sharpen, min:0, max:100, onChange:function(v){updateEdits({sharpen:v});}})
          ),
          e("div",{},
            e(Slider,{label:"Luruskan (fine rotate)", value:selected.edits.fine, min:-15, max:15, step:0.5, onChange:function(v){updateEdits({fine:v});}, suffix:"°"}),
            e("div",{style:{display:"flex",gap:8,marginBottom:14}},
              e("button",{onClick:function(){updateEdits({rotate90:(selected.edits.rotate90+90)%360});}, style:{flex:1,background:C.panel2,border:"1px solid "+C.line,borderRadius:6,padding:"8px 0",color:C.paper,display:"flex",alignItems:"center",justifyContent:"center",gap:6,fontSize:12.5}}, I.rotate, " Putar 90°")
            ),
            e("label",{style:{display:"block",fontSize:12,color:C.muted,marginBottom:6,fontFamily:"'JetBrains Mono',monospace"}}, "Rasio crop"),
            e("select",{value:selected.edits.aspect, onChange:function(ev){updateEdits({aspect:ev.target.value});}, style:{width:"100%",background:C.panel2,border:"1px solid "+C.line,color:C.paper,borderRadius:6,padding:8,marginBottom:10}},
              e("option",{value:"original"},"Asli"), e("option",{value:"1:1"},"1:1"), e("option",{value:"4:3"},"4:3"),
              e("option",{value:"3:2"},"3:2"), e("option",{value:"16:9"},"16:9"), e("option",{value:"9:16"},"9:16")
            ),
            e(Slider,{label:"Zoom crop", value:selected.edits.zoom, min:1, max:2, step:0.05, onChange:function(v){updateEdits({zoom:v});}, suffix:"×"})
          )
        )
      ) : null,
      e("button",{onClick:function(){downloadEdited(selected);}, style:{marginTop:16,display:"flex",alignItems:"center",gap:8,background:"transparent",border:"1px solid "+C.line,color:C.paper,borderRadius:7,padding:"9px 14px",fontSize:13}}, I.download, " Unduh foto hasil edit")
    );

    var meta = selected.meta;
    var metaSection = e("section",{style: isNarrow ? {width:"100%",overflowY:"auto",padding:14} : {width:380,overflowY:"auto",padding:20}},
      e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
        e("h3",{style:{margin:0,fontSize:13,letterSpacing:1,textTransform:"uppercase",color:C.muted}}, "Metadata"),
        e("button",{onClick:function(){runAI(selected.id);}, disabled:selected.metaLoading, style:{display:"flex",alignItems:"center",gap:7,background:C.teal,color:C.ink,border:"none",borderRadius:7,padding:"8px 12px",fontWeight:600,fontSize:12.5}},
          selected.metaLoading ? e("span",{className:"spin"},"◌") : I.sparkles, " ", meta ? "Generate ulang" : "Generate dgn AI"
        )
      ),
      selected.metaError ? e("div",{style:{color:C.clay,fontSize:12.5,marginBottom:10}}, selected.metaError) : null,
      (!meta && !selected.metaLoading) ? e("div",{style:{fontSize:12.5,color:C.muted,lineHeight:1.6}}, "Klik \"Generate dgn AI\" untuk membuat judul, deskripsi, keyword, dan kategori otomatis dari foto ini.") : null,
      meta ? e("div",{style:{display:"flex",flexDirection:"column",gap:14}},
        e("div",{},
          e("label",{style:{fontSize:11,color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}, "TITLE"),
          e("input",{type:"text", value:meta.title, onChange:function(ev){setMetaField(selected.id,"title",ev.target.value);},
            style:{width:"100%",background:C.panel2,border:"1px solid "+C.line,borderRadius:6,color:C.paper,padding:8,marginTop:4,fontSize:13}})
        ),
        e("div",{},
          e("label",{style:{fontSize:11,color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}, "DESCRIPTION (Shutterstock)"),
          e("textarea",{rows:2, value:meta.description_shutterstock, onChange:function(ev){setMetaField(selected.id,"description_shutterstock",ev.target.value);},
            style:{width:"100%",background:C.panel2,border:"1px solid "+C.line,borderRadius:6,color:C.paper,padding:8,marginTop:4,fontSize:13,resize:"vertical"}})
        ),
        e("div",{},
          e("label",{style:{fontSize:11,color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}, "CATEGORY — SHUTTERSTOCK"),
          e("div",{style:{display:"flex",gap:8,marginTop:4}},
            e("select",{value:meta.category_shutterstock_1, onChange:function(ev){setMetaField(selected.id,"category_shutterstock_1",ev.target.value);},
              style:{flex:1,background:C.panel2,border:"1px solid "+C.line,color:C.paper,borderRadius:6,padding:7,fontSize:12.5}},
              SS_CATEGORIES.map(function(c){ return e("option",{key:c,value:c},c); })
            ),
            e("select",{value:meta.category_shutterstock_2, onChange:function(ev){setMetaField(selected.id,"category_shutterstock_2",ev.target.value);},
              style:{flex:1,background:C.panel2,border:"1px solid "+C.line,color:C.paper,borderRadius:6,padding:7,fontSize:12.5}},
              e("option",{value:""},"—"), SS_CATEGORIES.map(function(c){ return e("option",{key:c,value:c},c); })
            )
          )
        ),
        e("div",{},
          e("label",{style:{fontSize:11,color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}, "CATEGORY — ADOBE STOCK"),
          e("select",{value:meta.category_adobe, onChange:function(ev){setMetaField(selected.id,"category_adobe",ev.target.value);},
            style:{width:"100%",background:C.panel2,border:"1px solid "+C.line,color:C.paper,borderRadius:6,padding:7,marginTop:4,fontSize:12.5}},
            ADOBE_CATEGORIES.map(function(c){ return e("option",{key:c,value:c},c); })
          )
        ),
        e("div",{},
          e("label",{style:{fontSize:11,color:C.muted,fontFamily:"'JetBrains Mono',monospace"}}, "KEYWORDS ("+meta.keywords.length+")"),
          e("div",{style:{marginTop:6}}, meta.keywords.map(function(k){ return e(Chip,{key:k, text:k, onRemove:function(){removeKeyword(selected.id,k);}}); }))
        ),
        e("div",{style:{display:"flex",gap:16,fontSize:12.5,color:C.muted}},
          e("span",{},"Editorial: ", e("b",{style:{color: meta.editorial?C.amber:C.teal}}, meta.editorial?"Ya":"Tidak")),
          e("span",{},"Mature: ", e("b",{style:{color: meta.mature_content?C.amber:C.teal}}, meta.mature_content?"Ya":"Tidak"))
        ),
        e("button",{onClick:function(){copyMeta(selected);}, style:{display:"flex",alignItems:"center",justifyContent:"center",gap:8,background:"transparent",border:"1px solid "+C.line,color:C.paper,borderRadius:7,padding:"9px 0",fontSize:13}}, I.copy, " Salin metadata")
      ) : null
    );

    workbench = e(React.Fragment,{}, editSection, metaSection);
  }

  var footer = e("footer",{style:{borderTop:"1px solid "+C.line,padding:"12px 24px",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}},
    e("span",{style:{fontSize:12,color:C.muted}}, items.filter(function(i){return i.meta;}).length + " dari " + items.length + " file punya metadata siap export"),
    e("div",{style:{display:"flex",gap:10}},
      e("button",{onClick:function(){exportCSV("shutterstock");}, style:{display:"flex",alignItems:"center",gap:7,background:C.panel2,border:"1px solid "+C.line,color:C.paper,borderRadius:7,padding:"9px 14px",fontSize:12.5}}, I.filedown, " CSV Shutterstock"),
      e("button",{onClick:function(){exportCSV("adobe");}, style:{display:"flex",alignItems:"center",gap:7,background:C.panel2,border:"1px solid "+C.line,color:C.paper,borderRadius:7,padding:"9px 14px",fontSize:12.5}}, I.filedown, " CSV Adobe Stock")
    )
  );

  return e("div",{style:{minHeight:"100vh",background:C.ink,color:C.paper,fontFamily:"'Inter',-apple-system,sans-serif",display:"flex",flexDirection:"column"}},
    header, settingsModal,
    e("div",{style: isNarrow ? {display:"flex",flexDirection:"column",flex:1,minHeight:0,overflowY:"auto"} : {display:"flex",flex:1,minHeight:0}}, filmstrip, workbench),
    footer
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
